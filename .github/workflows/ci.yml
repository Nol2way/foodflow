name: Validate FoodFlow
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run setup:database
      - run: npm --prefix backend run typecheck
      - run: npm test
      - run: npm run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm --prefix frontend run test:production
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm audit --prefix backend --audit-level=moderate
  postgres-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: foodflow-local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r database/requirements-test.txt
      - run: python database/tests/test_pos.py
        env:
          FOODFLOW_TEST_POSTGRES_URL: postgresql://postgres:foodflow-local-ci-only@127.0.0.1:5432/postgres
          REQUIRE_XML_TESTS: '1'
